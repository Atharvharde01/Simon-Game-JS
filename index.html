<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h2>press any keyboard key OR click the `start button` to start the game</h2>
    <button id="start-btn">Start Game</button>

    <div class="btn-container">
        <div class="lineone">
            <div class="btn pink" type="button" id="pink">1</div>
            <div class="btn yellow"type="button" id="yellow">4</div>
            
        </div>
        
        <div class="linetwo">
            <div class="btn red"type="button" id="red">2</div>
            <div class="btn blue"type="button" id="blue">3</div>
        </div>
        
    </div>
    <script src="simon.js"></script>
</body>
</html>
